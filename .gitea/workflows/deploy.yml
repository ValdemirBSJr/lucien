# Modo avançado gitea-runner: execute apenas em uma VM de runner dedicada.
# O modo gitea-compact não interpreta este workflow.
name: Deploy Runbooks Gitea (runner dedicado)

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-transfer:
    runs-on: ubuntu-latest
    env:
      DEPLOY_HOST: ${{ secrets.SERVIDORES_WIKI_HOST }}
      DEPLOY_USER: ${{ secrets.SERVIDORES_WIKI_USER }}
      DEPLOY_ROOT: ${{ secrets.SERVIDORES_WIKI_PATH }}
      RELEASE_SHA: ${{ gitea.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      # v5 mantém compatibilidade com runners Gitea/act que ainda não suportam Node 24.
      - name: Configurar Python e cache do Pip
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Instalar MkDocs
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-docs.txt

      - name: Compilar site estático
        run: mkdocs build --strict

      - name: Validar runner e destino
        shell: bash
        run: |
          set -euo pipefail
          command -v ssh >/dev/null
          command -v rsync >/dev/null
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          [[ "$DEPLOY_ROOT" =~ ^/[A-Za-z0-9._/-]+$ ]]
          [[ "$DEPLOY_ROOT" != *".."* ]]
          [[ "$RELEASE_SHA" =~ ^[a-fA-F0-9]{7,64}$ ]]

      - name: Preparar autenticação SSH
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          WIKI_KNOWN_HOSTS: ${{ secrets.WIKI_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_deploy"
          printf '%s\n' "$WIKI_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/id_deploy" "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/id_deploy" >/dev/null
          test -s "$HOME/.ssh/known_hosts"

      - name: Transferir e promover release
        shell: bash
        run: |
          set -euo pipefail
          release="$DEPLOY_ROOT/releases/$RELEASE_SHA"
          candidate="$DEPLOY_ROOT/.current-$RELEASE_SHA"
          ssh_opts="-i $HOME/.ssh/id_deploy -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts"

          ssh $ssh_opts "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$release'"
          rsync -az --delete-delay --safe-links -e "ssh $ssh_opts" \
            site/ "$DEPLOY_USER@$DEPLOY_HOST:$release/"
          ssh $ssh_opts "$DEPLOY_USER@$DEPLOY_HOST" \
            "set -eu; ln -sfn '$release' '$candidate'; mv -Tf '$candidate' '$DEPLOY_ROOT/current'"

      - name: Remover chave privada do runner
        if: always()
        shell: bash
        run: rm -f "$HOME/.ssh/id_deploy"

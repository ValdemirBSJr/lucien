site_name: Lucien Runbooks
site_description: Wiki operacional gerada e revisada pelo ecossistema Lucien
site_author: Equipe de Plataforma
docs_dir: docs
site_dir: site
strict: true

theme:
  name: material
  language: pt-BR
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Usar tema escuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Usar tema claro

plugins:
  # A busca indexa os dois idiomas; sem `en` a versao inglesa nao seria
  # encontravel pela propria busca do site.
  - search:
      lang:
        - pt
        - en
  # Estrutura por pasta: o que esta em `docs/en/` e ingles, o resto e o padrao.
  # O idioma padrao fica na RAIZ do site, e nao em `/pt/`, para que as URLs
  # atuais da documentacao continuem valendo.
  #
  # Isto vale so para a documentacao de consulta. Os runbooks publicados sao
  # construidos por `wiki-builder/mkdocs.yml`, que nao carrega este plugin:
  # a publicacao permanece na raiz, com a mesma estrutura, agnostica de idioma.
  - i18n:
      docs_structure: folder
      # Enquanto o espelho ingles nao esta completo, a pagina que falta cai na
      # versao em portugues em vez de sumir do site.
      fallback_to_default: true
      languages:
        - locale: pt
          name: Português (Brasil)
          default: true
          build: true
          theme:
            language: pt-BR
        - locale: en
          name: English
          build: true
          theme:
            language: en

# O mesmo hook confiável usado pelo builder compacto remove HTML ativo antes de
# o conteúdo entrar no tema. O código do hook deve permanecer protegido na main.
hooks:
  - wiki-builder/app/mkdocs_hook.py

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

exclude_docs: |
  .gitkeep

services:
  certgen:
    volumes: !override
      - demo-certs:/certs

  demo-cert-permissions:
    image: lucien-runbook-certgen:${LUCIEN_IMAGE_TAG:-publisher-demo}
    profiles: ["gitea-compact"]
    user: "0:0"
    entrypoint: ["/bin/sh", "-eu", "-c"]
    command:
      - |
        chmod 0600 /certs/ca.key
        chmod 0640 /certs/server.key
        chmod 0644 /certs/ca.crt /certs/server.crt
        chown 10004:10001 /certs/server.key
    volumes:
      - demo-certs:/certs
    read_only: true
    cap_drop: ["ALL"]
    cap_add: ["CHOWN", "FOWNER"]
    security_opt:
      - no-new-privileges:true
    network_mode: "none"
    restart: "no"

  demo-git-init:
    image: lucien-runbook-wiki-builder:${LUCIEN_IMAGE_TAG:-publisher-demo}
    profiles: ["gitea-compact"]
    user: "0:0"
    entrypoint: ["/bin/sh", "-eu", "-c"]
    command:
      - |
        if [ ! -d /repository/lucien.git ]; then
          git init --bare --initial-branch=main /repository/lucien.git
        fi
        git --git-dir=/repository/lucien.git read-tree --empty
        git --git-dir=/repository/lucien.git --work-tree=/seed add -A
        tree="$$(git --git-dir=/repository/lucien.git write-tree)"
        commit="$$(printf '%s\n' 'Conteúdo neutro do laboratório da wiki' | \
          GIT_AUTHOR_NAME='Lucien Demo' \
          GIT_AUTHOR_EMAIL='demo@localhost' \
          GIT_AUTHOR_DATE='2026-01-01T00:00:00Z' \
          GIT_COMMITTER_NAME='Lucien Demo' \
          GIT_COMMITTER_EMAIL='demo@localhost' \
          GIT_COMMITTER_DATE='2026-01-01T00:00:00Z' \
          git --git-dir=/repository/lucien.git commit-tree "$${tree}")"
        git --git-dir=/repository/lucien.git update-ref refs/heads/main "$${commit}"
        git --git-dir=/repository/lucien.git update-server-info
    volumes:
      - demo-git-data:/repository
      - ./testes/wiki-local/source:/seed:ro
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    network_mode: "none"
    restart: "no"

  wiki-source:
    image: lucien-runbook-wiki-builder:${LUCIEN_IMAGE_TAG:-publisher-demo}
    profiles: ["gitea-compact"]
    user: "10004:10001"
    entrypoint: ["python", "/lab/git_https_server.py"]
    volumes:
      - demo-git-data:/repository:ro
      - ./testes/wiki-local/git_https_server.py:/lab/git_https_server.py:ro
      - demo-certs:/certs:ro
    depends_on:
      demo-cert-permissions:
        condition: service_completed_successfully
      demo-git-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import ssl,urllib.request; urllib.request.urlopen('https://127.0.0.1:8443/healthz', context=ssl._create_unverified_context(), timeout=2)"
      interval: 2s
      timeout: 2s
      retries: 20
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    networks: [wiki_egress]
    restart: "no"

  wiki-builder:
    environment:
      WIKI_REPOSITORY_URL: https://wiki-source:8443/repos/lucien.git
      WIKI_REPOSITORY_BRANCH: main
      WIKI_REPOSITORY_USER: public-demo
      WIKI_REPOSITORY_TOKEN: public-demo-token
      WIKI_REPOSITORY_TOKEN_FILE: ""
      WIKI_GITEA_CA_FILE: /certs/ca.crt
    secrets: !override []
    volumes: !override
      - demo-certs:/certs:ro
      - wiki-source:/workspace
      - wiki-site:/publish
    depends_on:
      demo-cert-permissions:
        condition: service_completed_successfully
      demo-git-init:
        condition: service_completed_successfully
      wiki-source:
        condition: service_healthy

  wiki-static:
    ports: !override
      - "127.0.0.1:19092:8080"

volumes:
  demo-certs:
  demo-git-data:

networks:
  # O Compose-base mantém esta rede interna para uso atrás de proxy. O
  # laboratório publica diretamente em loopback e precisa aceitar a conexão
  # do host; somente o Nginx está ligado a ela.
  wiki_frontend:
    internal: false

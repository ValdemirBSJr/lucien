# Autenticação LDAP via PAM/SSSD.
UsePAM yes
PasswordAuthentication yes
KbdInteractiveAuthentication yes
PermitEmptyPasswords no

# Apenas identidades LDAP e administradores locais autorizados.
AllowGroups lucien-primary lucien-ssh-users

# Não permitir acesso remoto direto do root.
PermitRootLogin no

# Reduz superfície de abuso do jump server.
DisableForwarding yes
X11Forwarding no
PermitTunnel no
GatewayPorts no
PermitUserEnvironment no
PermitUserRC no

# Controle de sessões e tentativas.
MaxAuthTries 3
LoginGraceTime 30
MaxSessions 3
MaxStartups 10:30:30

# Detecta sessões abandonadas.
ClientAliveInterval 300
ClientAliveCountMax 2

# Melhora a rastreabilidade.
LogLevel VERBOSE

# Nginx interno: o workflow troca apenas o link simbólico "current".
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name runbooks.exemplo.interno;

    ssl_certificate /etc/nginx/tls/runbooks.crt;
    ssl_certificate_key /etc/nginx/tls/runbooks.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;

    root /srv/www/runbooks/current;
    index index.html;
    autoindex off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ /\. {
        deny all;
    }
}

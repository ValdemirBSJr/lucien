# Proxy reverso do portal local.
#
# Existe por uma razão de rede, não de desempenho: publicar porta exige rede
# não-interna, e rede não-interna dá saída para a internet. Colocando o Nginx
# na frente, quem ganha essa saída é ele -- e o runbook-viewer, que lê os
# runbooks publicados, continua isolado sem rota para fora.
#
# De quebra, é aqui que cabem limite de taxa e cabeçalhos, que a aplicação não
# precisa carregar.

# Limite de taxa nas TENTATIVAS de login, não no acesso à página.
#
# A chave vazia é ignorada pelo limit_req, então só o POST entra na conta. Sem
# isso, quem faz logout e volta para a tela de login gasta a cota navegando --
# e o limite passa a punir uso normal em vez de força bruta.
#
# 10 MB guardam ~160 mil endereços.
map $request_method $chave_login {
    POST    $binary_remote_addr;
    default "";
}

limit_req_zone $chave_login zone=viewer_login:10m rate=10r/m;

server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    server_name _;
    server_tokens off;

    # Mesmo material do viewer: o certificado do Hub já nomeia localhost e o
    # FQDN escolhido na instalação, que é por onde o operador chega.
    ssl_certificate /certs/server.crt;
    ssl_certificate_key /certs/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    ssl_prefer_server_ciphers off;

    # Só o que a aplicação não envia -- hoje, um cabeçalho.
    #
    # O runbook-viewer já responde com CSP, HSTS, Referrer-Policy, nosniff,
    # X-Frame-Options e Permissions-Policy. E a CSP dele é mais estrita que
    # qualquer uma escrita aqui, porque ele sabe o que a própria página
    # carrega. Repetir qualquer um deles duplicaria o cabeçalho na resposta: o
    # navegador aplicaria a interseção -- o que não abre buraco, mas deixa no
    # ar uma política mais frouxa e valores divergentes do que a aplicação
    # decidiu. Conferido na resposta real, um por um.
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # Um runbook com imagens embutidas passa de 1 MiB sem esforço.
    client_max_body_size 8m;

    # $http_host, e não $host: o primeiro repassa o cabeçalho como o cliente
    # mandou, com a porta; o segundo a descarta.
    #
    # A aplicação monta as URLs dos estáticos a partir daqui. Com $host ela
    # emitia https://127.0.0.1/static/app.css enquanto a página vivia em
    # https://127.0.0.1:9091 -- e para a CSP `'self'` é esquema, host E porta.
    # Origens diferentes: o navegador bloqueava CSS, script e logo, e o portal
    # aparecia como HTML cru. Vale para `form-action 'self'` pelo mesmo motivo.
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;

    # O viewer fala HTTPS mesmo dentro da rede interna, e a verificação recusa
    # quem não apresenta certificado assinado pela CA da instalação.
    #
    # O que ela NÃO faz: distinguir um serviço interno de outro. O Hub e o
    # portal apresentam o mesmo certificado -- conferido, mesmo SHA-256 --,
    # cujo SAN cobre os dois nomes. O controle vale de fora para dentro; quem
    # já sobe contêiner nesta rede também lê os certificados montados.
    proxy_ssl_trusted_certificate /certs/ca.crt;
    proxy_ssl_verify on;
    proxy_ssl_verify_depth 2;
    proxy_ssl_server_name on;
    proxy_ssl_name runbook-viewer;
    proxy_ssl_protocols TLSv1.2 TLSv1.3;

    # O nome do portal precisa resolver a cada requisição, não uma única vez
    # na carga da configuração. Com o nome literal em proxy_pass o nginx fixa
    # o IP no boot; toda atualização recria o container do portal com IP novo
    # e o proxy segue apontando para o endereço morto -- 502 em tudo, com o
    # portal saudável ao lado, até alguém reiniciar o nginx. Quem força a
    # consulta é a variável; o resolver é o DNS embutido do Docker.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $portal runbook-viewer;

    # Saúde do próprio proxy, respondida sem tocar na aplicação: se o viewer
    # cair, é o healthcheck dele que deve acusar, não o daqui.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /login {
        limit_req zone=viewer_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass https://$portal:9091;
    }

    location / {
        proxy_pass https://$portal:9091;
    }
}
